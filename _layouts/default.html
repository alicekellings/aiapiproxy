<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="wrap nav">
        <a class="brand" href="{{ site.baseurl }}/">AI API Proxy</a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="{{ site.baseurl }}/">首页</a>
          <a href="{{ site.baseurl }}/about/">关于</a>
          <a href="https://api.wappkit.com">官网</a>
        </nav>
      </div>
    </header>
    <main class="wrap content">
      {{ content }}
    </main>
    <footer class="wrap site-footer">
      AI API Proxy - OpenAI-compatible API gateway notes.
    </footer>
  </body>
</html>
